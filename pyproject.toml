[project]
name = "freeboard"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "mediapipe==1.2.2",
    "opencv-python==5.0.0.93",
    "pycaw>=20260927",
    "pyside6>=6.12.0",
    "screen-brightness-control>=0.27.2",
]
license = "MIT"
license-files = ["LICENSE"]

[project.scripts]
freeboard = "freeboard.__main__:main"

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[tool.pyside6.deploy]
title = "Freeboard"
input_file = "freeboard_app.py"
exec_directory = "dist"
icon = "assets/freeboard.ico"
mode = "standalone"
extra_args = "--windows-console-mode=disable --include-package-data=freeboard --include-raw-dir=.venv/Lib/site-packages/mediapipe/tasks/c=mediapipe/tasks/c"

[dependency-groups]
dev = [
    "nuitka==4.1.1",
    "ordered-set>=4.1.0",
    "zstandard>=0.25.0",
]
